name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Проверки приложения
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Настроить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Установить зависимости из lock-файла
        run: npm ci

      - name: Проверить типы
        run: npm run check

      - name: Проверить форматирование и линтинг
        run: npm run lint

      - name: Запустить модульные тесты
        run: npm test

      - name: Установить Chromium и системные зависимости
        run: npx playwright install --with-deps chromium

      - name: Собрать приложение и запустить браузерные тесты
        run: npm run test:e2e
